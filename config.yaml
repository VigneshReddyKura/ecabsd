data:
  ligand_distance_cutoff: 4.5
  pdb_dir: data/raw/pdbs
  processed_dir: data/processed
  raw_dir: data/raw
  splits_csv: data/splits.csv
docking:
  box_padding: 5.0
  energy_range: 3
  exhaustiveness: 8
  num_modes: 9
  vina_executable: vina
model:
  dropout: 0.3
  edge_feature_dim: 5
  esm_dim: 33
  graph_cutoff: 10.0
  hidden_dim: 256
  num_gcn_layers: 6
  num_heads: 4
  residue_max: 800
  residue_min: 30
  version: v3
paths:
  checkpoints_dir: checkpoints
  logs_dir: logs
  results_dir: results
prediction:
  output_format: csv
  threshold: 0.52
training:
  batch_size: 8
  chain_swap_prob: 0.5
  dice_weight: 0.40
  early_stopping_patience: 60
  epochs: 100
  focal_alpha: 0.90
  focal_gamma: 2.0
  gradient_clip: 1.0
  learning_rate: 0.0003
  loss: combined
  lr_scheduler: cosine_warmup
  num_workers: 0
  seed: 42
  warmup_epochs: 10
  weight_decay: 0.005
web:
  checkpoint: checkpoints/best_model_v3.pt
  host: 0.0.0.0
  port: 8000
