name: ecabsd
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # Core deep learning
      - torch==2.1.0
      - torchvision==0.16.0
      - torchaudio==2.1.0
      # PyTorch Geometric
      - torch-geometric==2.7.0
      - torch-scatter
      - torch-sparse
      - torch-cluster
      # Protein language model (ESM-2 via HuggingFace)
      - transformers==4.40.2
      - fair-esm==2.0.0
      # Structural biology
      - biopython==1.83
      - pydssp==0.9.0
      # Web & API
      - fastapi==0.111.0
      - uvicorn==0.29.0
      - python-multipart==0.0.9
      # CLI & config
      - typer==0.12.3
      - pyyaml==6.0.1
      # ML utilities
      - scikit-learn==1.4.2
      - numpy==1.26.4
      - pandas==2.2.2
      # Visualization
      - matplotlib==3.8.4
      - seaborn==0.13.2
      # Progress bars
      - tqdm==4.66.4
