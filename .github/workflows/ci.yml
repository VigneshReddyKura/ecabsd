name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU-only PyTorch
        run: |
          pip install torch==2.1.0 torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyTorch Geometric (CPU)
        run: |
          pip install torch-geometric==2.7.0
          pip install torch-scatter torch-sparse torch-cluster \
            --find-links https://data.pyg.org/whl/torch-2.1.0+cpu.html || \
          pip install torch-scatter torch-sparse torch-cluster \
            -f https://data.pyg.org/whl/torch-2.1.0+cpu.html

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio httpx anyio

      - name: Download test PDB file
        run: |
          mkdir -p data/sample
          curl -s -L "https://files.rcsb.org/download/1AY7.pdb" -o data/sample/1AY7.pdb
          ls -la data/sample/1AY7.pdb

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/
