version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecabsd_web
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      # Mount results and logs so predictions and history are persisted locally on the host
      - ./results:/app/results
      - ./logs:/app/logs
    restart: unless-stopped
