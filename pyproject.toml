[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ecabsd"
version = "3.0.0"
description = "Explainable Cross-Attention Model for Binding Site Discovery"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Amani Greeva", email = "" }
]
keywords = ["protein", "binding site", "graph neural network", "cross-attention", "bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torch-geometric>=2.7.0",
    "biopython>=1.81",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "anyio"]

[project.scripts]
ecabsd = "cli:app"

[project.urls]
Homepage = "https://github.com/amanigreeva/ECABSD"
Repository = "https://github.com/amanigreeva/ECABSD"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
